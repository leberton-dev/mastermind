[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
	"debugpy>=1.8.21",
	"numpy>=2.5.2",
	"pillow>=12.3.0",
	"pygame>=2.6.1",
	"pygame-gui>=0.6.14",
	"pyright>=1.1.411",
	"pytest>=8.0",
	"ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
