[project]
name = "mastermind"
version = "0.1.0"
description = "Mastermind in python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mastermind-kernel",
    "mastermind-overlay",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastermind"]

[dependency-groups]
dev = [
	"pyright>=1.1.411",
	"pytest>=8.0",
	"ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mastermind-kernel = { workspace = true }
mastermind-overlay = { workspace = true }
