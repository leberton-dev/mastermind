[project]
name = "mastermind-overlay"
version = "0.1.0"
description = "Roguelike layer on top of the mastermind kernel: scoring, relics, economy, run/ante state"
requires-python = ">=3.13"
dependencies = ["mastermind-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastermind_overlay"]

[tool.uv.sources]
mastermind-kernel = { workspace = true }
